<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiragana Audio</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbf8f2;--ink:#2b3a4a;--sub:#6b7480;--line:#d9d2c4;--key:#ffffff;--hit:#f3d9d4;--accent:#2f6f8f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}
.lead{color:var(--sub);font-size:14px;margin:0 0 14px;line-height:1.5}
.tabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.tabs button{flex:1;padding:12px 6px;font-size:15px;border:0;background:var(--key);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.k{aspect-ratio:1/1;border:1px solid var(--line);border-radius:4px;background:var(--key);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(26px,8vw,38px);line-height:1;color:var(--ink);cursor:pointer;padding:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
.k small{font-size:11px;color:var(--sub);margin-top:5px;font-family:system-ui,sans-serif}
.k.empty{visibility:hidden}
.k.on{background:var(--hit);border-color:#c98f86}
.k.ans{outline:3px solid var(--accent);outline-offset:-3px}
#find{display:none}
.panel{border:1px solid var(--line);border-radius:4px;background:var(--key);padding:16px;margin-bottom:14px;text-align:center}
.panel p{margin:0 0 12px;font-size:15px;line-height:1.5}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 16px;font-size:15px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;cursor:pointer;min-width:120px}
.btn.ghost{background:#fff;color:var(--accent)}
#answer{font-size:42px;margin:12px 0 0;min-height:48px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
footer{color:var(--sub);font-size:12px;margin-top:22px;line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>Hiragana Audio</h1>
  <p class="lead">Recorded by a native Japanese speaker. Each sound plays the kana, then the picture word on your card.</p>

  <div class="tabs" role="group" aria-label="Mode">
    <button id="tChart" aria-pressed="true">Tap &amp; Listen</button>
    <button id="tFind" aria-pressed="false">Listen &amp; Find</button>
  </div>

  <section id="find">
    <div class="panel">
      <p>Press <b>Play</b>, listen, and find the card on your table.</p>
      <div class="row">
        <button class="btn" id="play">Play</button>
        <button class="btn ghost" id="again">Again</button>
        <button class="btn ghost" id="show">Show answer</button>
      </div>
      <div id="answer" aria-live="polite"></div>
    </div>
  </section>

  <div class="grid" id="grid"></div>

  <footer>Tip: turn off silent mode on iPhone if you hear nothing.<br>© YunoMonStudio · for buyers' personal and classroom use.</footer>
</main>
<script>
const K=[["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],["や","ya"],null,["ゆ","yu"],null,["よ","yo"],["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],["わ","wa"],null,null,null,["を","wo"],["ん","n"],null,null,null,null];
const grid=document.getElementById('grid'),audio=new Audio();audio.preload='auto';
const btns={};let mode='chart',current=null,lit=null;
K.forEach(k=>{const b=document.createElement('button');
  if(!k){b.className='k empty';b.tabIndex=-1;b.setAttribute('aria-hidden','true');grid.appendChild(b);return;}
  b.className='k';b.innerHTML=k[0]+'<small>'+k[1]+'</small>';b.setAttribute('aria-label',k[1]);
  b.onclick=()=>{play(k[1]);if(mode==='find'&&current){b.classList.toggle('ans',k[1]===current);}};
  btns[k[1]]=b;grid.appendChild(b);});
function play(r){audio.pause();audio.src=r+'.mp3';audio.currentTime=0;audio.play().catch(()=>{});
  if(lit)lit.classList.remove('on');lit=btns[r];if(mode==='chart'){lit.classList.add('on');}}
audio.onended=()=>{if(lit)lit.classList.remove('on');};
const set=m=>{mode=m;document.getElementById('find').style.display=m==='find'?'block':'none';
  tChart.setAttribute('aria-pressed',m==='chart');tFind.setAttribute('aria-pressed',m==='find');
  Object.values(btns).forEach(b=>b.classList.remove('ans','on'));document.getElementById('answer').textContent='';current=null;};
tChart.onclick=()=>set('chart');tFind.onclick=()=>set('find');
const keys=K.filter(Boolean).map(k=>k[1]);
document.getElementById('play').onclick=()=>{let r;do{r=keys[Math.floor(Math.random()*keys.length)]}while(r===current&&keys.length>1);
  current=r;Object.values(btns).forEach(b=>b.classList.remove('ans'));document.getElementById('answer').textContent='';play(r);};
document.getElementById('again').onclick=()=>{if(current)play(current);};
document.getElementById('show').onclick=()=>{if(!current)return;const k=K.find(x=>x&&x[1]===current);
  document.getElementById('answer').textContent=k[0];btns[current].classList.add('ans');};
</script>
</body>
</html>
